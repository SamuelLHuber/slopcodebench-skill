      kind: if_statement
      pattern: |
        if not $T:
            continue
---
id: manual-set-union-loop
language: python
severity: info
message: "`s = set(); for r in it: s.update(r.X())` - use `set().union(*(r.X() for r in it))` or a comprehension"
metadata:
  weight: 1
  category: slop
rule:
  kind: expression_statement
  has:
    kind: assignment
    pattern: $S = set()
  precedes:
    stopBy: neighbor
    kind: for_statement
    pattern: |
      for $R in $COLL:
          $S.update($R.$METHOD())
---
id: fixed-chunk-file-hash
language: python
severity: warning
message: "`while True: chunk = f.read(N); if not chunk: break; h.update(chunk)` - use `hashlib.file_digest(f, ALGO)`"
metadata:
  weight: 5
  category: slop
rule:
  kind: while_statement
  pattern: |
    while True:
        $CHUNK = $F.read($N)
        if not $CHUNK:
            break
        $H.update($CHUNK)
---
id: pointless-lambda-call
language: python
severity: warning
message: "Immediately-invoked lambda `(lambda: ...)()` - inline the expression"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  has:
    kind: parenthesized_expression
    has:
      kind: lambda
---
id: unnecessary-lambda
language: python
severity: warning
message: "`lambda x: f(x)` - pass `f` directly"
metadata:
  weight: 5
  category: slop
rule:
  kind: lambda
  pattern: 'lambda $ARG: $FN($ARG)'
---
id: empty-init
language: python
severity: warning
message: "Empty `__init__` - delete it, Python provides a default constructor"
metadata:
  weight: 5
  category: slop
rule:
  kind: function_definition
  all:
  - has:
      kind: identifier
      regex: ^__init__$
  - has:
      kind: block
      has:
        kind: pass_statement
---
id: redundant-return-none
language: python
severity: info
message: "`return None` at end of function - drop it, `None` returns implicitly"
metadata:
  weight: 1
  category: slop
rule:
  kind: return_statement
  pattern: return None
  inside:
    kind: block
    inside:
      kind: function_definition
  not:
    precedes:
      stopBy: neighbor
      any:
      - kind: expression_statement
      - kind: return_statement
      - kind: if_statement
      - kind: for_statement
      - kind: while_statement
      - kind: try_statement
      - kind: with_statement
      - kind: raise_statement
---
id: swallow-exception-pass-multi-stmt
language: python
severity: warning
message: "`except ...: pass` after multi-step work hides real failures; catch specific errors or log"
metadata:
  weight: 5
  category: slop
rule:
  any:
  - pattern: |
      try:
        $FIRST
        $SECOND
        $$$REST
      except Exception:
        pass
  - pattern: |
      try:
        $FIRST
        $SECOND
        $$$REST
      except Exception as $ERR:
        pass
  - pattern: |
      try:
        $FIRST
        $SECOND
        $$$REST
      except:
        pass
---
id: tokenizer-char-append-branch
language: python
severity: info
message: "Per-char tokenizer branches with `append` + `pos += 1` - use `{char: TokenType}` lookup table"
metadata:
  weight: 1
  category: slop
rule:
  kind: expression_statement
  has:
    pattern: $OBJ.tokens.append($NEW_TOKEN)
  precedes:
    kind: expression_statement
    has:
      pattern: $OBJ.pos += 1
---
id: except-bare-reraise
language: python
severity: warning
message: Catching an exception only to re-raise it adds noise; drop the try/except
metadata:
  weight: 5
  category: slop
rule:
  kind: except_clause
  has:
    kind: block
    regex: "^\\s*raise\\s*$"
---
id: except-pass-silence
language: python
severity: warning
message: except clause with bare pass silently swallows errors
metadata:
  weight: 5
  category: slop
rule:
  kind: except_clause
  has:
    kind: block
    has:
      kind: pass_statement
---
id: except-oserror-ioerror-pair
language: python
severity: warning
message: IOError is an alias for OSError since Py3.3; drop the pair
metadata:
  weight: 5
  category: slop
rule:
  kind: except_clause
  regex: "\\(OSError,\\s*IOError\\)|\\(IOError,\\s*OSError\\)"
---
id: pragma-no-cover-defensive
language: python
severity: info
message: pragma no cover suppresses coverage on dead branches; remove the branch instead
metadata:
  weight: 1
  category: slop
rule:
  kind: comment
  regex: "pragma:\\s*no\\s+cover"
---
id: per-method-assert-not-none
language: python
severity: info
message: assert self.X is not None at method entry - enforce in __init__ once
metadata:
  weight: 1
  category: slop
rule:
  kind: assert_statement
  pattern: "assert self.$F is not None"
---
id: del-unused-param
language: python
severity: warning
message: del on a named parameter inside a function silences unused-param lint - drop from signature
metadata:
  weight: 5
  category: slop
rule:
  kind: delete_statement
  not:
    has:
      any:
      - kind: subscript
      - kind: attribute
      - kind: call
  inside:
    kind: function_definition
    stopBy: end
---
id: wrapper-isvalid-oneliner
language: python
severity: info
message: One-line is_valid_X wrapping a regex match/search/fullmatch adds no value
metadata:
  weight: 1
  category: slop
rule:
  kind: function_definition
  all:
  - has:
      kind: identifier
      regex: "^is_valid"
  - has:
      kind: block
      has:
        kind: return_statement
        regex: "bool\\(.*\\.(match|fullmatch|search)\\("
---
id: manual-removeprefix-replace
language: python
severity: warning
message: s.replace(p, '') if s.startswith(p) else s - use str.removeprefix
metadata:
  weight: 5
  category: slop
rule:
  pattern: "$S.replace($P, $EMPTY) if $S.startswith($P) else $S"
---
id: section-banner-comment
language: python
severity: info
message: Decorative section banner comment - delete, let structure speak for itself
metadata:
  weight: 1
  category: slop
rule:
  kind: comment
  regex: "^#\\s*[-=─]{10,}\\s*$"
---
id: dataclass-count-explosion
language: python
severity: info
message: "@dataclass decorator - 10+ in one file suggests TypedDict or consolidation target"
metadata:
  weight: 1
  category: slop
  min_file_count: 10
rule:
  kind: decorator
  regex: "^@dataclass"
---
id: dataclass-few-attributes
language: python
severity: info
message: "@dataclass with <=2 scalar attributes - use a NamedTuple or tuple unless you need mutability"
metadata:
  weight: 1
  category: slop
rule:
  kind: class_definition
  all:
  - inside:
      kind: decorated_definition
      stopBy: neighbor
      has:
        kind: decorator
        regex: "^@dataclass"
  - has:
      kind: block
      all:
      - not:
          has:
            nthChild:
              position: 3
      - not:
          has:
            stopBy: end
            kind: generic_type
---
id: dataclass-tagged-union-discriminator
language: python
severity: info
message: "@dataclass with `kind: str` + multiple Optional fields - model as distinct types or a Literal discriminator"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern: |
      @dataclass
      class $C:
          $K: str
          $N1: Optional[$$$T1] = $$$D1
          $N2: Optional[$$$T2] = $$$D2
  - pattern: |
      @dataclass
      class $C:
          $K: str
          $N1: Optional[$$$T1] = $$$D1
          $N2: Optional[$$$T2] = $$$D2
          $$$REST
  - pattern: |
      @dataclass($$$A)
      class $C:
          $K: str
          $N1: Optional[$$$T1] = $$$D1
          $N2: Optional[$$$T2] = $$$D2
  - pattern: |
      @dataclass($$$A)
      class $C:
          $K: str
          $N1: Optional[$$$T1] = $$$D1
          $N2: Optional[$$$T2] = $$$D2
          $$$REST
constraints:
  K:
    regex: "^(kind|type|tag)$"
---
id: empty-exception-subclass
language: python
severity: info
message: "Empty Error/Exception/Warning subclass - use one base error and pass context in the message"
metadata:
  weight: 1
  category: slop
rule:
  kind: class_definition
  all:
  - has:
      kind: argument_list
      regex: "(Error|Exception|Warning)"
  - not:
      has:
        kind: function_definition
        stopBy: end
  - not:
      has:
        kind: decorated_definition
        stopBy: end
        has:
          kind: function_definition
---
id: identity-wrapper-function
language: python
severity: info
message: "`def f(x): return g(x)` - identity wrapper adds no value; call the inner function directly"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern: |
      def $NAME($ARG):
          return $CALL($ARG)
  - pattern: |
      def $NAME($ARG) -> $T2:
          return $CALL($ARG)
  - pattern: |
      def $NAME($ARG: $T1):
          return $CALL($ARG)
  - pattern: |
      def $NAME($ARG: $T1) -> $T2:
          return $CALL($ARG)
  not:
    inside:
      kind: decorated_definition
      stopBy: neighbor
---
id: predicate-isinstance-wrapper
language: python
severity: info
message: "`def is_X(v) -> bool: return isinstance(v, T)` - inline the isinstance check; the wrapper adds no value"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern: |
      def $NAME($ARG) -> bool:
          return isinstance($ARG, $T)
  - pattern: |
      def $NAME($ARG: $_) -> bool:
          return isinstance($ARG, $T)
---
id: lambda-generator-throw
language: python
severity: warning
message: "`(_ for _ in ()).throw(...)` - raise inside a lambda via generator hack; use `def helper(): raise ...`"
metadata:
  weight: 5
  category: slop
rule:
  pattern: "(_ for _ in ()).throw($_)"
---
id: oswalk-relpath-sep-replace
language: python
severity: info
message: "`os.walk` + `os.path.relpath` + `.replace(os.sep, '/')` - use `Path(root).rglob('*')` and `.relative_to(root).as_posix()`"
metadata:
  weight: 1
  category: slop
rule:
  kind: for_statement
  all:
  - has:
      kind: call
      stopBy: end
      regex: "os\\.walk"
  - has:
      stopBy: end
      regex: "os\\.path\\.relpath"
  - has:
      stopBy: end
      regex: "\\.replace\\(os\\.sep"
---
id: generic-with-any
language: python
severity: info
message: "`<Container>[..., Any, ...]` - specify concrete element types or use a `TypedDict`/`@dataclass`/`Protocol`"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern:
      context: "x: $C[Any]"
      selector: type
  - pattern:
      context: "x: $C[Any, $$$A]"
      selector: type
  - pattern:
      context: "x: $C[$$$A, Any]"
      selector: type
  - pattern:
      context: "x: $C[$$$A, Any, $$$B]"
      selector: type
constraints:
  C:
    not:
      any:
      - regex: "^Union$"
      - regex: "^Optional$"
      - regex: "^Callable$"
---
id: union-with-any
language: python
severity: warning
message: "`Union[..., Any]` / `... | Any` - drop `Any`, it subsumes every other member"
metadata:
  weight: 5
  category: slop
rule:
  any:
  - pattern:
      context: "x: Union[Any, $$$A]"
      selector: type
  - pattern:
      context: "x: Union[$$$A, Any]"
      selector: type
  - pattern:
      context: "x: Union[$$$A, Any, $$$B]"
      selector: type
  - pattern:
      context: "x: Any | $T"
      selector: type
  - pattern:
      context: "x: $T | Any"
      selector: type
constraints:
  T:
    not:
      regex: "^None$"
---
id: optional-any
language: python
severity: warning
message: "`Optional[Any]` / `Any | None` - reduces to `Any`; drop the wrapper"
metadata:
  weight: 5
  category: slop
rule:
  any:
  - pattern:
      context: "x: Optional[Any]"
      selector: type
  - pattern:
      context: "x: Any | None"
      selector: type
  - pattern:
      context: "x: None | Any"
      selector: type
---
id: callable-any-return
language: python
severity: info
message: "`Callable[..., Any]` - specify the return type; `...` already erases the parameter signature"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern:
      context: "x: Callable[..., Any]"
      selector: type
  - pattern:
      context: "x: Callable[$P, Any]"
      selector: type
---
id: object-type-annotation
language: python
severity: info
message: "`object` annotation - use a concrete type, `Protocol`, or `Any`"
metadata:
  weight: 1
  category: slop
rule:
  kind: type
  any:
  - regex: ^object$
  - regex: ^"object"$
  - regex: ^'object'$
  - regex: ^builtins\.object$
---
id: legacy-typing-capitalized-imports
language: python
severity: warning
message: "Deprecated `typing` import - use built-ins (list/dict/tuple/set/type), `collections.*`, or `X | Y` / `X | None` (PEP 585/604)"
metadata:
  weight: 5
  category: slop
rule:
  kind: import_from_statement
  all:
  - has:
      kind: dotted_name
      regex: "^typing$"
  - has:
      stopBy: end
      kind: dotted_name
      regex: "^(Dict|List|Optional|Tuple|Union|Set|FrozenSet|Type|DefaultDict|Deque|ChainMap|Counter|OrderedDict)$"
---
id: manual-str-join
language: python
severity: warning
message: "building a string with `+=` in a loop - collect parts in a list then `''.join(parts)`"
metadata:
  weight: 5
  category: slop
rule:
  kind: augmented_assignment
  all:
    - pattern: $S += $X
    - has:
        field: right
        any:
          - kind: string              # matches "..." and f"..." both
          - pattern: str($_)
          - pattern: $_.format($$$)
          - pattern: repr($_)
    - inside:
        stopBy: end
        any:
          - kind: for_statement
          - kind: while_statement
---
id: json-dumps-then-loads
language: python
severity: warning
message: "`json.loads(json.dumps(x))` - use `copy.deepcopy(x)`"
metadata:
  weight: 5
  category: slop
rule:
  pattern: json.loads(json.dumps($X))
---
id: json-loads-read
language: python
severity: warning
message: "`json.loads(f.read())` - use `json.load(f)`"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  pattern: json.loads($F.read())
---
id: int-float-coerce
language: python
severity: warning
message: "`int(float(x))` - parse once or validate input format (mis-handles strings like `'1e2'`)"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  pattern: int(float($X))
---
id: unnecessary-cast-str
language: python
severity: warning
message: "`str('x')` - string literal is already a string"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  all:
  - has:
      kind: identifier
      regex: ^str$
  - has:
      kind: argument_list
      has:
        kind: string
---
id: redundant-str-in-fstring
language: python
severity: warning
message: "`f'{str(x)}'` - use `f'{x}'`, f-strings auto-convert"
metadata:
  weight: 5
  category: slop
rule:
  kind: interpolation
  has:
    kind: call
    pattern: str($X)
---
id: verbose-type-conversion-chain
language: python
severity: warning
message: "Chained type conversions like `str(int(x))` - parse once or validate input format"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  any:
  - pattern: str(int($X))
  - pattern: int(str($X))
  - pattern: str(float($X))
  - pattern: float(str($X))
  - pattern: list(tuple($X))
  - pattern: tuple(list($X))
---
id: double-conversion-int-float
language: python
severity: warning
message: "`int(float(x))` - parse directly or validate input (mis-handles `'1e2'`, `'1.5'`)"
metadata:
  weight: 5
  category: slop
rule:
  kind: call
  any:
  - pattern: int(float($X))
  - pattern: float(int($X))
---
id: verbose-string-concat-str
language: python
severity: warning
message: "`str(x) + str(y)` - use `f'{x}{y}'`"
metadata:
  weight: 5
  category: slop
rule:
  pattern: str($X) + str($Y)
---
id: verbose-string-literal-plus-str
language: python
severity: warning
message: "`'...' + str(x)` - use `f'...{x}'`"
metadata:
  weight: 5
  category: slop
rule:
  kind: binary_operator
  regex: ^['"].*['"]\s*\+\s*str\(
---
id: manual-quote-strip
language: python
severity: info
message: "`if s.startswith(q) and s.endswith(q): s[1:-1]` - use `ast.literal_eval(s)` or `s.strip(q)`"
metadata:
  weight: 1
  category: slop
rule:
  pattern: "if $VAL.startswith($Q1) and $VAL.endswith($Q1):\n  $OUT = $VAL[1:-1]\n"
---
id: manual-bool-str-parse
language: python
severity: info
message: "`if s == 'true': ... elif s == 'false': ...` - use `{'true': True, 'false': False}[s]` or `json.loads(s)`"
metadata:
  weight: 1
  category: slop
rule:
  pattern: "if $VAL == 'true':\n    $OUT = True\nelif $VAL == 'false':\n    $OUT =\
    \ False\n"
---
id: manual-float-dot-check
language: python
severity: info
message: "`if '.' in s: float(s)` - brittle; use `ast.literal_eval` or `try: float(s) except ValueError:`"
metadata:
  weight: 1
  category: slop
rule:
  pattern: "if '.' in $VAL:\n    $OUT = float($VAL)\n"
---
id: manual-line-continuation-join
language: python
severity: info
message: "`line += ' ' + part` in loop - collect parts into a list then `' '.join(parts)`"
metadata:
  weight: 1
  category: slop
rule:
  pattern: $LINE += " " + $PART
---
id: returncode-int-cast
language: python
severity: warning
message: int(proc.returncode) - returncode is already int
metadata:
  weight: 5
  category: slop
rule:
  pattern: int($X.returncode)
---
id: suffix-slice-removesuffix
language: python
severity: warning
message: "`s[:-len('literal')]` - use `s.removesuffix('literal')`"
metadata:
  weight: 5
  category: slop
rule:
  kind: subscript
  has:
    kind: slice
    regex: "^:\\s*-\\s*len\\(\\s*['\"].*['\"]\\s*\\)\\s*$"
