          stopBy: end
          kind: if_statement
          any:
            - pattern: |
                if $V is None:
                    return $$$A
            - pattern: |
                if $V is None:
                    raise $$$A
      - has:
          stopBy: end
          kind: if_statement
          any:
            - pattern: |
                if $V2 is None:
                    return $$$A
            - pattern: |
                if $V2 is None:
                    raise $$$A
          precedes:
            stopBy: end
            kind: if_statement
            any:
              - pattern: |
