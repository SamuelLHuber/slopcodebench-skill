id: init-populate-iterate-list
language: python
severity: info
message: "Create-append-iterate `$LIST` - use `[expr for ...]` or skip the intermediate list"
note: 'Consider refactoring to:

  1. List comprehension: [val for item in items if cond]

  2. Helper function: def collect_items(source) -> list

  3. Generator expression if only iterating once: (val for item in items)

  '
metadata:
  weight: 1
  category: slop
rule:
  kind: for_statement
  all:
  # tighten: only suggest this when the consumer loop body is a single statement
  # (multi-step consumers are often clearer as explicit loops)
  - pattern: |
      for $VAR in $LIST:
          $STMT
  - has:
      kind: block
      all:
      - not:
          has:
            nthChild:
              position: 2
      - not:
          has:
            any:
            - kind: if_statement
            - kind: for_statement
            - kind: while_statement
            - kind: try_statement
            - kind: with_statement
            - kind: match_statement
  - not:
      has:
        kind: call
        has:
          kind: attribute
          regex: \.(items|keys|values)$
  - follows:
      all:
      - kind: for_statement
      - has:
          kind: call
          has:
            kind: attribute
            all:
            - has:
                kind: identifier
                field: object
                pattern: $LIST
            - has:
                field: attribute
                regex: ^append$
          stopBy: end
      - follows:
          kind: expression_statement
          has:
            kind: assignment
            all:
            - has:
                kind: identifier
                field: left
                pattern: $LIST
            - has:
                kind: list
                field: right
                not:
                  has:
                    any:
                    - kind: identifier
                    - kind: string
                    - kind: integer
          stopBy:
            kind: for_statement
      stopBy: end
