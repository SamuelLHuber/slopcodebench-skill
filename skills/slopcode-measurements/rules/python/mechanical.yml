id: is-true-false-strict
language: python
severity: warning
message: is True / is False identity check - use truthiness
metadata:
  weight: 5
  category: slop
rule:
  kind: comparison_operator
  any:
  - pattern: $X is True
  - pattern: $X is False
  - pattern: $X is not True
  - pattern: $X is not False
---
id: bool-numeric-triple-guard
language: python
severity: info
message: isinstance bool guard combined with numeric isinstance - wrap in helper rather than inlining
metadata:
  weight: 1
  category: slop
rule:
  kind: boolean_operator
  regex: "isinstance\\([^,]+,\\s*bool\\).*isinstance"
---
id: mutual-isinstance-or-and
language: python
severity: info
message: "`isinstance(a, T) or isinstance(b, T): return isinstance(a, T) and isinstance(b, T) and ...` - lift `type(a) is type(b) is T` or an early-return guard"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  pattern: |
    if isinstance($L, $T) or isinstance($R, $T):
        return isinstance($L, $T) and isinstance($R, $T) and $BODY
---
id: duplicated-if-condition
language: python
severity: warning
message: "Same condition in `if` and `elif` - elif branch is unreachable, remove it"
metadata:
  weight: 5
  category: slop
rule:
  kind: if_statement
  pattern: "if $COND:\n  $$$\nelif $COND:\n  $$$\n"
---
id: isinstance-return-ladder
language: python
severity: info
message: "`isinstance` ladder returning literals - use dispatch dict `{Type: value}[type(x)]` or polymorphism"
metadata:
  weight: 1
  category: slop
rule:
  any:
  - pattern: "if isinstance($X, $T1):\n  return $V1\nelif isinstance($X, $T2):\n  return\
      \ $V2\n"
  - kind: if_statement
    all:
    - pattern: "if isinstance($X, $T1):\n  return $V1\n"
    - precedes:
        stopBy: neighbor
        kind: if_statement
        pattern: "if isinstance($X, $T2):\n  return $V2\n"
---
id: manual-min-max
language: python
severity: info
message: "Manual min/max `if a > b: m = a else: m = b` - use `m = max(a, b)` / `min(a, b)`"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  any:
  - pattern: "if $A > $B:\n  $M = $A\nelse:\n  $M = $B\n"
  - pattern: "if $A < $B:\n  $M = $A\nelse:\n  $M = $B\n"
  - pattern: "if $A >= $B:\n  $M = $A\nelse:\n  $M = $B\n"
  - pattern: "if $A <= $B:\n  $M = $A\nelse:\n  $M = $B\n"
---
id: nested-if-no-else
language: python
severity: info
message: "Nested `if` is the only statement in outer `if` body and neither has `else` - combine with `and` into a single condition"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  all:
  - has:
      stopBy: neighbor
      kind: block
      all:
      # there is a nested if without else/elif as a direct child
      - has:
          stopBy: neighbor
          kind: if_statement
          not:
            any:
            - has:
                stopBy: neighbor
                kind: else_clause
            - has:
                stopBy: neighbor
                kind: elif_clause
      # ...and no other direct child statement (only the nested if)
      - not:
          has:
            stopBy: neighbor
            not:
              kind: if_statement
  - not:
      any:
      - has:
          stopBy: neighbor
          kind: else_clause
      - has:
          stopBy: neighbor
          kind: elif_clause
---
id: nested-guard-invert
language: python
severity: info
message: "Nested `if` early-exit guard with sibling code in outer `if` body - invert outer to early-exit (`if not outer: return/continue`) and flatten the nesting"
metadata:
  weight: 1
  category: slop
rule:
  kind: if_statement
  all:
  # outer if must not have else/elif
  - not:
      any:
      - has:
          stopBy: neighbor
          kind: else_clause
      - has:
          stopBy: neighbor
          kind: elif_clause
  # outer if body contains nested early-exit if plus sibling code
  - has:
      stopBy: neighbor
      kind: block
      all:
      # contains a nested if without else/elif whose body has an early exit
      - has:
          stopBy: neighbor
          kind: if_statement
          all:
          - not:
              any:
              - has:
                  stopBy: neighbor
                  kind: else_clause
              - has:
                  stopBy: neighbor
                  kind: elif_clause
          - has:
              stopBy: neighbor
              kind: block
              has:
                stopBy: neighbor
                any:
                - kind: return_statement
                - kind: continue_statement
                - kind: raise_statement
                - kind: break_statement
      # ...AND has at least one direct child that is not the nested if
      # (this is what distinguishes from nested-if-no-else)
      - has:
          stopBy: neighbor
          not:
            kind: if_statement
  # only suggest inversion when this if is tail-position in its parent block
  - not:
      precedes:
        stopBy: neighbor
        any:
        - kind: expression_statement
        - kind: return_statement
        - kind: if_statement
        - kind: for_statement
        - kind: while_statement
        - kind: try_statement
        - kind: with_statement
        - kind: raise_statement
        - kind: assert_statement
        - kind: import_statement
        - kind: import_from_statement
        - kind: global_statement
        - kind: nonlocal_statement
        - kind: delete_statement
        - kind: pass_statement
        - kind: break_statement
        - kind: continue_statement
        - kind: match_statement
---
id: repeated-if-continue
language: python
severity: info
message: "Multiple `if: continue` guards - combine with `or` or filter via comprehension"
metadata:
  weight: 1
  category: slop
rule:
  kind: for_statement
  has:
    kind: block
    has:
      kind: if_statement
      has:
        kind: block
        has:
          kind: continue_statement
      follows:
        kind: if_statement
        has:
          kind: block
          has:
            kind: continue_statement
---
id: repeated-if-return-error
