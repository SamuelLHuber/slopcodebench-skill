---
id: go-bool-comparison
language: go
severity: warning
message: '[mapped go slop rule] Boolean comparison to literal; use the boolean expression directly.'
metadata:
  category: slop
  mapping_family: bool-comparison
rule:
  kind: binary_expression
  regex: '(==|!=)\s*(true|false)\b|\b(true|false)\s*(==|!=)'

---
id: go-len-as-condition
language: go
severity: warning
message: '[mapped go slop rule] len(x) compared to zero; prefer direct length boundary checks only when needed.'
metadata:
  category: slop
  mapping_family: len-as-condition
rule:
  kind: binary_expression
  regex: 'len\s*\([^)]*\)\s*(==|!=|>|>=|<|<=)\s*(0|1)\b'

---
id: go-nil-guard-ladder
language: go
severity: info
message: '[mapped go slop rule] Repeated nil checks with early exits; normalize at API boundaries.'
metadata:
  category: slop
  mapping_family: nil-guard-ladder
rule:
  kind: if_statement
  all:
    - regex: '(==|!=)\s*nil\b|\bnil\s*(==|!=)'
    - has:
        stopBy: end
        kind: return_statement

---
id: go-boolean-return-if-else
language: go
severity: info
message: '[mapped go slop rule] if/else returning boolean literals; return the condition or negation.'
metadata:
  category: slop
  mapping_family: boolean-return-if-else
rule:
  kind: if_statement
  regex: 'return\s+(true|false)[\s\S]*else[\s\S]*return\s+(false|true)'

---
id: go-index-loop
language: go
severity: warning
message: '[mapped go slop rule] Index loop over len(x); prefer range when the index is not essential.'
metadata:
  category: slop
  mapping_family: index-loop
rule:
  kind: for_statement
  regex: 'for\s+[^;]*:=\s*0\s*;[^;]*<\s*len\s*\('

---
id: go-append-in-loop
language: go
severity: info
message: '[mapped go slop rule] Append loop; consider preallocation, direct transformation, or helper.'
metadata:
  category: slop
  mapping_family: append-in-loop
rule:
  kind: for_statement
  has:
    stopBy: end
    kind: call_expression
    regex: '\bappend\s*\('

---
id: go-repeated-if-guard
language: go
severity: info
message: '[mapped go slop rule] Consecutive guard if-statements with returns.'
metadata:
  category: slop
  mapping_family: repeated-if-guard
rule:
  kind: if_statement
  all:
    - follows:
        stopBy: neighbor
        kind: if_statement
    - has:
        stopBy: end
        kind: return_statement

---
id: go-nested-if-no-else
language: go
severity: info
message: '[mapped go slop rule] Nested if without else; consider combining conditions or guard clauses.'
metadata:
  category: slop
  mapping_family: nested-if-no-else
rule:
  kind: if_statement
  all:
    - has:
        stopBy: end
        kind: if_statement

---
id: go-error-wrap-string
language: go
severity: info
message: '[mapped go slop rule] Repeated fmt.Errorf wrapping can obscure error contracts; prefer typed/sentinel errors when appropriate.'
metadata:
  category: slop
  mapping_family: error-wrap-string
rule:
  kind: call_expression
  regex: 'fmt\.Errorf\s*\('
