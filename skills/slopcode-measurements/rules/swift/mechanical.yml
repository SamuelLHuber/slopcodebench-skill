---
id: swift-bool-comparison
language: swift
severity: warning
message: '[mapped swift slop rule] Boolean comparison to literal; use the boolean expression directly.'
metadata:
  category: slop
  mapping_family: bool-comparison
rule:
  kind: source_file
  regex: '(==|!=)\s*(true|false)\b|\b(true|false)\s*(==|!=)'

---
id: swift-nil-guard-ladder
language: swift
severity: info
message: '[mapped swift slop rule] Repeated nil checks with early exits; normalize optionality at boundaries.'
metadata:
  category: slop
  mapping_family: nil-guard-ladder
rule:
  kind: if_statement
  regex: '(==|!=)\s*nil\b|\bnil\s*(==|!=)'

---
id: swift-count-as-condition
language: swift
severity: warning
message: '[mapped swift slop rule] count/isEmpty boundary check; prefer isEmpty for emptiness.'
metadata:
  category: slop
  mapping_family: count-as-condition
rule:
  kind: source_file
  regex: '\.(count)\s*(==|!=|>|>=|<|<=)\s*(0|1)\b'

---
id: swift-boolean-return-if-else
language: swift
severity: info
message: '[mapped swift slop rule] if/else returning boolean literals; return the condition or negation.'
metadata:
  category: slop
  mapping_family: boolean-return-if-else
rule:
  kind: if_statement
  regex: 'return\s+(true|false)[\s\S]*else[\s\S]*return\s+(false|true)'

---
id: swift-append-in-loop
language: swift
severity: info
message: '[mapped swift slop rule] Append loop; consider map/filter/compactMap or append(contentsOf:) where idiomatic.'
metadata:
  category: slop
  mapping_family: append-in-loop
rule:
  kind: source_file
  regex: 'for\s+[^\n]+\{[\s\S]*\.append\s*\('

---
id: swift-force-unwrap
language: swift
severity: warning
message: '[mapped swift slop rule] Force unwrap is often a defensive shortcut; prove invariant or handle optional explicitly.'
metadata:
  category: slop
  mapping_family: force-unwrap
rule:
  kind: source_file
  regex: '![).,;\]
  ]'

---
id: swift-string-concat-loop
language: swift
severity: warning
message: '[mapped swift slop rule] String concatenation in a loop; use joined/builder style where appropriate.'
metadata:
  category: slop
  mapping_family: string-concat-loop
rule:
  kind: source_file
  regex: 'for\s+[^\n]+\{[\s\S]*(\+=|=\s*[^\n]+\+)'

---
id: swift-section-banner-comment
language: swift
severity: info
message: '[mapped swift slop rule] Decorative section banner comment; prefer structure/names over banners.'
metadata:
  category: slop
  mapping_family: section-banner-comment
rule:
  kind: comment
  regex: '^//\s*[-=─]{10,}\s*$'
