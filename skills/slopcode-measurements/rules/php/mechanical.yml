---
id: php-bool-comparison
language: php
severity: warning
message: '[mapped php slop rule] Boolean comparison to literal; use the boolean expression directly.'
metadata:
  category: slop
  mapping_family: bool-comparison
rule:
  kind: binary_expression
  regex: '(==|!=|===|!==)\s*(true|false)\b|\b(true|false)\s*(==|!=|===|!==)'

---
id: php-null-guard-ladder
language: php
severity: info
message: '[mapped php slop rule] Repeated null checks with early exits; normalize optionality at boundaries.'
metadata:
  category: slop
  mapping_family: null-guard-ladder
rule:
  kind: if_statement
  regex: '(==|!=|===|!==)\s*null\b|\bnull\s*(==|!=|===|!==)'

---
id: php-count-as-condition
language: php
severity: warning
message: '[mapped php slop rule] count() compared to zero; prefer empty() for emptiness where semantically correct.'
metadata:
  category: slop
  mapping_family: count-as-condition
rule:
  kind: binary_expression
  regex: 'count\s*\([^)]*\)\s*(==|!=|>|>=|<|<=)\s*(0|1)\b'

---
id: php-boolean-return-if-else
language: php
severity: info
message: '[mapped php slop rule] if/else returning boolean literals; return the condition or negation.'
metadata:
  category: slop
  mapping_family: boolean-return-if-else
rule:
  kind: if_statement
  regex: 'return\s+(true|false)\s*;[\s\S]*else[\s\S]*return\s+(false|true)\s*;'

---
id: php-append-in-loop
language: php
severity: info
message: '[mapped php slop rule] Append loop; consider array_map/filter or direct construction where idiomatic.'
metadata:
  category: slop
  mapping_family: append-in-loop
rule:
  kind: if_statement
  regex: '\[\]\s*='

---
id: php-string-concat-loop
language: php
severity: warning
message: '[mapped php slop rule] String concatenation in a loop; collect parts and implode where appropriate.'
metadata:
  category: slop
  mapping_family: string-concat-loop
rule:
  kind: if_statement
  regex: '\.(=|\s)'

---
id: php-catch-sentinel
language: php
severity: warning
message: '[mapped php slop rule] Broad catch returning sentinel can hide failures.'
metadata:
  category: slop
  mapping_family: catch-sentinel
rule:
  kind: program
  regex: 'catch\s*\([^)]*(Exception|Throwable)[^)]*\)[\s\S]*return\s+(null|false|true|\[\]|0)'

---
id: php-section-banner-comment
language: php
severity: info
message: '[mapped php slop rule] Decorative section banner comment; prefer structure/names over banners.'
metadata:
  category: slop
  mapping_family: section-banner-comment
rule:
  kind: comment
  regex: '^//\s*[-=─]{10,}\s*$'
