---
id: csharp-bool-comparison
language: csharp
severity: warning
message: '[mapped csharp slop rule] Boolean comparison to literal; use the boolean expression directly.'
metadata:
  category: slop
  mapping_family: bool-comparison
rule:
  kind: binary_expression
  regex: '(==|!=|===|!==)\s*(true|false)\b|\b(true|false)\s*(==|!=|===|!==)'

---
id: csharp-len-as-condition
language: csharp
severity: warning
message: '[mapped csharp slop rule] Length/size compared to zero; prefer emptiness APIs or direct boundary predicates where idiomatic.'
metadata:
  category: slop
  mapping_family: len-as-condition
rule:
  kind: binary_expression
  regex: '(\.(len|length|Length|Count)\b|\.(size|count)\s*\(\)|\blen\s*\()[^\n;]*(==|!=|>|>=|<|<=)\s*(0|1)\b'

---
id: csharp-nullable-guard-ladder
language: csharp
severity: info
message: '[mapped csharp slop rule] Repeated null/nil checks with early exits; normalize optionality at the boundary when possible.'
metadata:
  category: slop
  mapping_family: nullable-guard-ladder
rule:
  kind: if_statement
  all:
    - regex: '(==|!=)\s*(null|nil|nullptr)\b|\b(null|nil|nullptr)\s*(==|!=)'
    - has:
        stopBy: end
        any:
          - kind: return_statement
          - kind: comment

---
id: csharp-boolean-return-if-else
language: csharp
severity: info
message: '[mapped csharp slop rule] if/else returning boolean literals; return the condition or its negation.'
metadata:
  category: slop
  mapping_family: boolean-return-if-else
rule:
  kind: if_statement
  regex: 'return\s+(true|false)\s*;[\s\S]*else[\s\S]*return\s+(false|true)\s*;'

---
id: csharp-nested-if-no-else
language: csharp
severity: info
message: '[mapped csharp slop rule] Nested if without else; consider combining conditions or extracting a guard.'
metadata:
  category: slop
  mapping_family: nested-if-no-else
rule:
  kind: if_statement
  all:
    - has:
        stopBy: end
        kind: if_statement

---
id: csharp-repeated-if-guard
language: csharp
severity: info
message: '[mapped csharp slop rule] Consecutive guard if-statements with early exits; consider combining or extracting validation.'
metadata:
  category: slop
  mapping_family: repeated-if-guard
rule:
  kind: if_statement
  all:
    - follows:
        stopBy: neighbor
        kind: if_statement
    - has:
        stopBy: end
        any:
          - kind: return_statement
          - kind: comment

---
id: csharp-repeated-validation-calls
language: csharp
severity: info
message: '[mapped csharp slop rule] Repeated validate/check calls; consider a validator table/loop.'
metadata:
  category: slop
  mapping_family: repeated-validation-calls
rule:
  kind: expression_statement
  has:
    kind: invocation_expression
    regex: '\b(validate|verify|check)[A-Za-z0-9_]*\('
  follows:
    stopBy: neighbor
    kind: expression_statement
    has:
      kind: invocation_expression
      regex: '\b(validate|verify|check)[A-Za-z0-9_]*\('

---
id: csharp-append-in-loop
language: csharp
severity: info
message: '[mapped csharp slop rule] Single-purpose append/push loop; consider map/filter/extend/collect where idiomatic.'
metadata:
  category: slop
  mapping_family: append-in-loop
rule:
  kind: for_statement
  has:
    stopBy: end
    kind: invocation_expression
    regex: '\.(append|push|push_back|add|Add|AddRange|emplace_back|insert)\('

---
id: csharp-consecutive-append-calls
language: csharp
severity: info
message: '[mapped csharp slop rule] Consecutive append/push calls; consider batch append/extend or literal initialization.'
metadata:
  category: slop
  mapping_family: consecutive-append-calls
rule:
  kind: expression_statement
  has:
    kind: invocation_expression
    regex: '\.(append|push|push_back|add|Add|emplace_back|insert)\('
  follows:
    stopBy: neighbor
    kind: expression_statement
    has:
      kind: invocation_expression
      regex: '\.(append|push|push_back|add|Add|emplace_back|insert)\('

---
id: csharp-manual-string-concat-loop
language: csharp
severity: warning
message: '[mapped csharp slop rule] String concatenation in a loop; collect parts/use builder/join where idiomatic.'
metadata:
  category: slop
  mapping_family: manual-string-concat-loop
rule:
  kind: assignment_expression
  regex: '(\+=|=\s*[^;\n]+\+)'
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: while_statement

---
id: csharp-manual-string-dispatch
language: csharp
severity: info
message: '[mapped csharp slop rule] if/else string equality dispatch; consider map/table dispatch or enum parsing.'
metadata:
  category: slop
  mapping_family: manual-string-dispatch
rule:
  kind: if_statement
  regex: '==\s*"[^"]+"[\s\S]*else'

---
id: csharp-section-banner-comment
language: csharp
severity: info
message: '[mapped csharp slop rule] Decorative section banner comment; prefer structure/names over banners.'
metadata:
  category: slop
  mapping_family: section-banner-comment
rule:
  kind: comment
  regex: '^//\s*[-=─]{10,}\s*$'

---
id: csharp-identity-wrapper-function
language: csharp
severity: info
message: '[mapped csharp slop rule] Method appears to just return another call; wrapper may add little value.'
metadata:
  category: slop
  mapping_family: identity-wrapper-function
rule:
  kind: method_declaration
  regex: 'return\s+[A-Za-z_][A-Za-z0-9_.]*\([^;{}]*\)\s*;'

---
id: csharp-linq-to-list-before-foreach
language: csharp
severity: warning
message: '[mapped csharp slop rule] Materializing ToList before foreach may be redundant.'
metadata:
  category: slop
  mapping_family: linq-to-list-before-foreach
rule:
  kind: for_statement
  regex: '\.ToList\s*\('
