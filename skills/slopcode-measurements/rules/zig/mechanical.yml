---
id: zig-bool-comparison
language: zig
severity: warning
message: '[mechanical Zig port of bool-comparison] `x == True` / `x == False` - use `if x:` / `if not x:`'
metadata:
  category: slop
  source_python_rule: bool-comparison
rule:
  kind: binary_expression
  any:
    - pattern: '_EXPR == true'
    - pattern: '_EXPR == false'
    - pattern: '_EXPR != true'
    - pattern: '_EXPR != false'

---
id: zig-chained-none-check
language: zig
severity: info
message: '[mechanical Zig port of chained-none-check] `x is not None and y is not None` - use `all(v is not None for v in (x, y))` or try/except'
metadata:
  category: slop
  source_python_rule: chained-none-check
rule:
  kind: if_statement
  all:
    - regex: '(==|!=)\s*null[\s\S]*(and|or)[\s\S]*(==|!=)\s*null'
    - has:
        stopBy: end
        any:
          - kind: return_expression
          - kind: continue_expression
          - kind: break_expression

